
<!DOCTYPE html>
<html>
<head>
    <title>NoteBook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5146a5">
    <link rel="manifest" href="manifest.json">

<style>
* { box-sizing: border-box; }

html, body { overscroll-behavior-y: none; }

body {
    font-family: Arial, sans-serif;
    background: #f3f1fb;
    color: #25233a;
    margin: 0;
    padding: 20px;
    transition: 0.3s;
}

.container {
    max-width: 600px;
    margin: auto;
}

header {
    text-align: center;
    padding: 20px 0;
}

header h1 {
    color: #5146a5;
    font-size: 30px;
    margin-bottom: 5px;
}

header p { color: #777; margin-top: 5px; }

input, textarea, select {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-size: 16px;
    background: white;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    margin: 5px 3px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: #5146a5;
    color: white;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

#notes { margin-top: 20px; }

#notes > div {
    background: white;
    padding: 16px;
    margin: 14px 0;
    border-radius: 16px;
    box-shadow: 0 4px 12px #00000010;
    overflow-wrap: anywhere;
}

#notes h3 {
    color: #5146a5;
    margin-top: 0;
}

#notes p {
    white-space: pre-wrap;
    line-height: 1.5;
}

small { color: #888; }

.delete-btn { background: #dc4545; }
.edit-btn { background: #7770bd; }

.fav-btn, .filter-btn {
    background: #e8b323;
    color: #25233a;
}

.backup-btn { background: #16875d; }
.restore-btn { background: #2878bd; }

.category-label {
    display: inline-block;
    background: #eeeafd;
    color: #5146a5;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin: 5px 0;
}

.dark-mode {
    background: #171725;
    color: white;
}

.dark-mode header h1,
.dark-mode #notes h3 {
    color: #c4b5fd;
}

.dark-mode header p,
.dark-mode small { color: #aaa; }

.dark-mode input,
.dark-mode textarea,
.dark-mode select {
    background: #29293b;
    color: white;
    border-color: #444;
}

.dark-mode #notes > div,
.dark-mode #lockScreen,
.dark-mode #changePINBox {
    background: #29293b;
    color: white;
}

.dark-mode .category-label {
    background: #40365e;
    color: #ddd0ff;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px;
}

#lockScreen, #changePINBox {
    max-width: 400px;
    margin: 60px auto;
    text-align: center;
    padding: 30px 20px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 15px #00000012;
}

#lockScreen h1, #changePINBox h2 {
    color: #5146a5;
}

#pinInput, #oldPIN, #newPIN, #confirmPIN {
    text-align: center;
    letter-spacing: 8px;
    font-size: 22px;
}

#changePINBox { display: none; }
#restoreFile { display: none; }

.section-title {
    margin-top: 20px;
    color: #5146a5;
    font-size: 15px;
}
</style>
</head>

<body>

<div id="lockScreen">
    <h1>🔐 NoteBook Locked</h1>
    <p>Enter your 4-digit PIN</p>

    <input type="password" id="pinInput"
        maxlength="4" inputmode="numeric"
        pattern="[0-9]*" autocomplete="off"
        placeholder="Enter PIN">

    <button onclick="checkPIN()">Unlock</button>
    <p id="pinMessage"></p>
</div>

<div class="container" id="appContent" style="display:none;">

    <header>
        <h1>NoteBook ✨</h1>
        <p>Your personal notebook</p>
    </header>

    <input type="text" id="search"
        placeholder="🔍 Search notes..."
        oninput="displayNotes()">

    <h3 class="section-title">📝 Create a Note</h3>

    <input type="text" id="title"
        placeholder="Enter note title...">

    <textarea id="note"
        placeholder="Write your note here..."></textarea>

    <input type="text" id="category"
        list="categorySuggestions"
        placeholder="📁 Category (Personal, Work...)">

    <datalist id="categorySuggestions"></datalist>

    <div class="actions">
        <button onclick="addNote()">＋ Add Note</button>
    </div>

    <h3 class="section-title">📁 Categories</h3>

    <input type="text" id="newCategory"
        placeholder="Create a new category...">

    <div class="actions">
        <button onclick="addCategory()">＋ Add Category</button>
    </div>

    <select id="categoryFilter" onchange="displayNotes()">
        <option value="all">📚 All Categories</option>
    </select>

    <div class="actions">

        <button onclick="toggleDarkMode()" id="darkBtn">
            🌙 Dark Mode
        </button>

        <button onclick="toggleFavorites()"
            id="filterBtn" class="filter-btn">
            ⭐ Favorites
        </button>

        <button onclick="showChangePIN()">
            🔐 Change PIN
        </button>

        <button onclick="backupNotes()" class="backup-btn">
            📤 Backup
        </button>

        <button onclick="openRestore()" class="restore-btn">
            📥 Restore
        </button>

        <input type="file" id="restoreFile"
            accept=".json,application/json"
            onchange="restoreNotes(event)">

    </div>

    <div id="notes"></div>

    <div id="changePINBox">
        <h2>🔐 Change PIN</h2>

        <input type="password" id="oldPIN"
            maxlength="4" inputmode="numeric"
            placeholder="Old PIN">

        <input type="password" id="newPIN"
            maxlength="4" inputmode="numeric"
            placeholder="New 4-digit PIN">

        <input type="password" id="confirmPIN"
            maxlength="4" inputmode="numeric"
            placeholder="Confirm new PIN">

        <button onclick="saveNewPIN()">Save PIN</button>
        <button onclick="hideChangePIN()">Cancel</button>

        <p id="changePINMessage"></p>
    </div>

</div>

<script>

let savedPIN = localStorage.getItem("myNotesPIN");

if (!savedPIN) {
    document.querySelector("#lockScreen h1").innerText =
        "🔐 Create Your PIN";

    document.querySelector("#lockScreen p").innerText =
        "Set your 4-digit PIN";

    document.querySelector("#lockScreen button").innerText =
        "Set PIN";
}

let notes = JSON.parse(localStorage.getItem("myNotes")) || [];

let categories =
    JSON.parse(localStorage.getItem("myNoteCategories")) || [];

let favOnly = false;

/* OLD NOTES COMPATIBILITY */

notes = notes.map(function(note) {

    if (typeof note === "string") {
        return {
            title: "Untitled",
            text: note,
            date: "",
            favorite: false,
            category: ""
        };
    }

    if (note.favorite === undefined) {
        note.favorite = false;
    }

    if (note.category === undefined) {
        note.category = "";
    }

    return note;
});

/* SAVE */

function saveNotes() {
    localStorage.setItem("myNotes", JSON.stringify(notes));
}

function saveCategories() {
    localStorage.setItem(
        "myNoteCategories",
        JSON.stringify(categories)
    );
}

/* PIN */

function checkPIN() {

    let pin = document.getElementById("pinInput").value;

    if (!/^\d{4}$/.test(pin)) {
        document.getElementById("pinMessage").innerText =
            "Enter exactly 4 digits!";
        return;
    }

    if (!savedPIN) {
        localStorage.setItem("myNotesPIN", pin);
        savedPIN = pin;
    } else if (pin !== savedPIN) {
        document.getElementById("pinMessage").innerText =
            "Wrong PIN! Try again.";
        return;
    }

    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";

    saveNotes();
    displayCategories();
    displayNotes();
}

function showChangePIN() {
    document.getElementById("changePINBox").style.display = "block";
    document.getElementById("changePINMessage").innerText = "";
}

function hideChangePIN() {
    document.getElementById("changePINBox").style.display = "none";

    document.getElementById("oldPIN").value = "";
    document.getElementById("newPIN").value = "";
    document.getElementById("confirmPIN").value = "";
    document.getElementById("changePINMessage").innerText = "";
}

function saveNewPIN() {

    let oldPIN = document.getElementById("oldPIN").value;
    let newPIN = document.getElementById("newPIN").value;
    let confirmPIN = document.getElementById("confirmPIN").value;
    let message = document.getElementById("changePINMessage");

    if (oldPIN !== savedPIN) {
        message.innerText = "Old PIN is incorrect!";
        return;
    }

    if (!/^\d{4}$/.test(newPIN)) {
        message.innerText = "New PIN must be 4 digits!";
        return;
    }

    if (newPIN !== confirmPIN) {
        message.innerText = "New PINs do not match!";
        return;
    }

    if (newPIN === oldPIN) {
        message.innerText = "Choose a different PIN!";
        return;
    }

    localStorage.setItem("myNotesPIN", newPIN);
    savedPIN = newPIN;

    message.innerText = "PIN changed successfully! ✅";

    document.getElementById("oldPIN").value = "";
    document.getElementById("newPIN").value = "";
    document.getElementById("confirmPIN").value = "";
}

/* CATEGORIES */

function addCategory() {

    let input = document.getElementById("newCategory");
    let name = input.value.trim();

    if (!name) {
        alert("Enter a category name!");
        return;
    }

    let exists = categories.some(function(category) {
        return category.toLowerCase() === name.toLowerCase();
    });

    if (exists) {
        alert("This category already exists!");
        return;
    }

    categories.push(name);

    saveCategories();
    displayCategories();

    input.value = "";

    alert("Category created successfully! 📁");
}

function displayCategories() {

    let filter = document.getElementById("categoryFilter");
    let suggestions = document.getElementById("categorySuggestions");

    let selected = filter.value || "all";

    filter.innerHTML = '<option value="all">📚 All Categories</option>';
    suggestions.innerHTML = "";

    categories.forEach(function(category) {

        let option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        filter.appendChild(option);

        let suggestion = document.createElement("option");
        suggestion.value = category;
        suggestions.appendChild(suggestion);
    });

    if (categories.includes(selected)) {
        filter.value = selected;
    } else {
        filter.value = "all";
    }
}

/* ADD NOTE */

function addNote() {

    let title = document.getElementById("title").value;
    let note = document.getElementById("note").value;
    let category = document.getElementById("category").value.trim();

    if (note.trim() === "") {
        alert("Please write something!");
        return;
    }

    if (category) {

        let exists = categories.some(function(item) {
            return item.toLowerCase() === category.toLowerCase();
        });

        if (!exists) {
            categories.push(category);
            saveCategories();
        }
    }

    notes.push({
        title: title.trim() || "Untitled",
        text: note.trim(),
        date: new Date().toLocaleString(),
        favorite: false,
        category: category
    });

    saveNotes();
    displayCategories();
    displayNotes();

    document.getElementById("title").value = "";
    document.getElementById("note").value = "";
    document.getElementById("category").value = "";
}

/* FAVORITES */

function toggleFavorites() {

    favOnly = !favOnly;

    document.getElementById("filterBtn").innerText =
        favOnly ? "📒 Show All Notes" : "⭐ Favorites";

    displayNotes();
}

/* DISPLAY NOTES */

function displayNotes() {

    let area = document.getElementById("notes");
    let search = document.getElementById("search").value.toLowerCase();
    let selectedCategory = document.getElementById("categoryFilter").value;

    area.innerHTML = "";

    let found = 0;

    notes.forEach(function(note, index) {

        if (
            !note.title.toLowerCase().includes(search) &&
            !note.text.toLowerCase().includes(search) &&
            !(note.category || "").toLowerCase().includes(search)
        ) {
            return;
        }

        if (favOnly && !note.favorite) {
            return;
        }

        if (
            selectedCategory !== "all" &&
            note.category !== selectedCategory
        ) {
            return;
        }

        found++;

        let box = document.createElement("div");

        let heading = document.createElement("h3");
        heading.innerText =
            (note.favorite ? "⭐ " : "") + note.title;

        let content = document.createElement("p");
        content.innerText = note.text;

        let date = document.createElement("small");
        date.innerText = note.date || "";

        box.appendChild(heading);
        box.appendChild(content);

        if (note.category) {
            let label = document.createElement("div");
            label.className = "category-label";
            label.innerText = "📁 " + note.category;
            box.appendChild(label);
        }

        box.appendChild(document.createElement("br"));
        box.appendChild(date);
        box.appendChild(document.createElement("br"));

        let fav = document.createElement("button");
        fav.className = "fav-btn";
        fav.innerText = note.favorite ? "⭐ Favourite" : "☆ Favourite";

        fav.onclick = function() {
            notes[index].favorite = !notes[index].favorite;
            saveNotes();
            displayNotes();
        };

        let edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.innerText = "Edit";

        edit.onclick = function() {

            let newTitle = prompt("Edit title:", note.title);
            if (newTitle === null) return;

            let newText = prompt("Edit note:", note.text);
            if (newText === null) return;

            let newCategory = prompt(
                "Edit category:",
                note.category || ""
            );

            if (newCategory === null) return;

            newCategory = newCategory.trim();

            if (newCategory) {

                let exists = categories.some(function(item) {
                    return item.toLowerCase() === newCategory.toLowerCase();
                });

                if (!exists) {
                    categories.push(newCategory);
                    saveCategories();
                }
            }

            notes[index].title = newTitle.trim() || "Untitled";
            notes[index].text = newText.trim();
            notes[index].category = newCategory;

            saveNotes();
            displayCategories();
            displayNotes();
        };

        let del = document.createElement("button");
        del.className = "delete-btn";
        del.innerText = "Delete";

        del.onclick = function() {

            if (confirm("Delete this note?")) {
                notes.splice(index, 1);
                saveNotes();
                displayNotes();
            }
        };

        box.appendChild(fav);
        box.appendChild(edit);
        box.appendChild(del);

        area.appendChild(box);
    });

    if (found === 0) {
        area.innerHTML =
            '<p class="empty">No notes found 📝</p>';
    }
}

/* BACKUP */

function backupNotes() {

    let backup = {
        app: "NoteBook",
        version: 2,
        backupDate: new Date().toISOString(),
        notes: notes,
        categories: categories
    };

    let data = JSON.stringify(backup, null, 2);

    let blob = new Blob([data], {
        type: "application/json"
    });

    let url = URL.createObjectURL(blob);

    let link = document.createElement("a");
    link.href = url;
    link.download = "NoteBook-Backup-" +
        new Date().toISOString().slice(0, 10) + ".json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);

    alert("Backup downloaded successfully! ✅");
}

/* RESTORE */

function openRestore() {
    document.getElementById("restoreFile").click();
}

function restoreNotes(event) {

    let file = event.target.files[0];

    if (!file) return;

    let reader = new FileReader();

    reader.onload = function() {

        try {

            let backup = JSON.parse(reader.result);

            let importedNotes = Array.isArray(backup)
                ? backup
                : backup.notes;

            let importedCategories = Array.isArray(backup)
                ? []
                : (backup.categories || []);

            if (!Array.isArray(importedNotes) ||
                !Array.isArray(importedCategories)) {
                alert("Invalid NoteBook backup file!");
                return;
            }

            let validNotes = importedNotes.filter(function(note) {

                return note &&
                    typeof note.title === "string" &&
                    typeof note.text === "string";
            });

            if (validNotes.length !== importedNotes.length) {
                alert("Backup contains invalid notes!");
                return;
            }

            if (!importedCategories.every(function(item) {
                return typeof item === "string";
            })) {
                alert("Backup contains invalid categories!");
                return;
            }

            if (!confirm(
                "Restore " + validNotes.length +
                " notes and " + importedCategories.length +
                " categories? Existing data will be kept."
            )) {
                return;
            }

            let added = 0;

            validNotes.forEach(function(note) {

                let exists = notes.some(function(current) {

                    return current.title === note.title &&
                        current.text === note.text &&
                        current.date === note.date &&
                        (current.category || "") === (note.category || "");
                });

                if (!exists) {

                    notes.push({
                        title: note.title,
                        text: note.text,
                        date: note.date || "",
                        favorite: !!note.favorite,
                        category: note.category || ""
                    });

                    added++;
                }
            });

            importedCategories.forEach(function(category) {

                let exists = categories.some(function(current) {
                    return current.toLowerCase() === category.toLowerCase();
                });

                if (!exists) {
                    categories.push(category);
                }
            });

            saveNotes();
            saveCategories();

            displayCategories();
            displayNotes();

            alert(
                "Restore completed! ✅\n" +
                added + " new notes added."
            );

        } catch (error) {

            alert("Unable to read backup file!");
        }

        event.target.value = "";
    };

    reader.readAsText(file);
}

/* DARK MODE */

function toggleDarkMode() {

    document.body.classList.toggle("dark-mode");

    let dark = document.body.classList.contains("dark-mode");

    localStorage.setItem("darkMode", dark ? "on" : "off");

    document.getElementById("darkBtn").innerText =
        dark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "on") {

    document.body.classList.add("dark-mode");

    document.getElementById("darkBtn").innerText =
        "☀️ Light Mode";
}

/* SERVICE WORKER */

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(function(error) {
                console.log("Service Worker Error:", error);
            });
    });
}

</script>
</body>
</html>
