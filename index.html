
<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5146a5">
    <link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
}

html, body {
    overscroll-behavior-y: none;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f1fb;
    color: #25233a;
    margin: 0;
    padding: 20px;
    transition: 0.3s;
}

.container {
    max-width: 600px;
    margin: auto;
}

header {
    text-align: center;
    padding: 20px 0;
}

header h1 {
    color: #5146a5;
    font-size: 30px;
    margin-bottom: 5px;
}

header p {
    color: #777;
    margin-top: 5px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-size: 16px;
    background: white;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    margin: 5px 3px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: #5146a5;
    color: white;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

#notes {
    margin-top: 20px;
}

#notes > div {
    background: white;
    padding: 16px;
    margin: 14px 0;
    border-radius: 16px;
    box-shadow: 0 4px 12px #00000010;
    overflow-wrap: anywhere;
}

#notes h3 {
    color: #5146a5;
    margin-top: 0;
}

#notes p {
    white-space: pre-wrap;
    line-height: 1.5;
}

small {
    color: #888;
}

.delete-btn {
    background: #dc4545;
}

.edit-btn {
    background: #7770bd;
}

.fav-btn {
    background: #e8b323;
    color: #25233a;
}

.filter-btn {
    background: #e8b323;
    color: #25233a;
}

.dark-mode {
    background: #171725;
    color: white;
}

.dark-mode header h1,
.dark-mode #notes h3 {
    color: #c4b5fd;
}

.dark-mode header p,
.dark-mode small {
    color: #aaa;
}

.dark-mode input,
.dark-mode textarea {
    background: #29293b;
    color: white;
    border-color: #444;
}

.dark-mode #notes > div {
    background: #29293b;
    color: white;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px;
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>My Notes ✨</h1>
    <p>Your personal notebook</p>
</header>

<input type="text" id="search"
placeholder="🔍 Search notes..." oninput="displayNotes()">

<input type="text" id="title"
placeholder="Enter note title...">

<textarea id="note"
placeholder="Write your note here..."></textarea>

<div class="actions">
    <button onclick="addNote()">＋ Add Note</button>
    <button onclick="toggleDarkMode()" id="darkBtn">
        🌙 Dark Mode
    </button>
    <button onclick="toggleFavorites()" id="filterBtn" class="filter-btn">
        ⭐ Favorites
    </button>
</div>

<div id="notes"></div>

</div>

<script>
let notes = JSON.parse(localStorage.getItem("myNotes")) || [];
let favOnly = false;

notes = notes.map(function(note) {
    if (typeof note === "string") {
        return {
            title: "Untitled",
            text: note,
            date: "",
            favorite: false
        };
    }

    if (note.favorite === undefined) {
        note.favorite = false;
    }

    return note;
});

function saveNotes() {
    localStorage.setItem("myNotes", JSON.stringify(notes));
}

function addNote() {
    let title = document.getElementById("title").value;
    let note = document.getElementById("note").value;

    if (note.trim() === "") {
        alert("Please write something!");
        return;
    }

    notes.push({
        title: title.trim() || "Untitled",
        text: note.trim(),
        date: new Date().toLocaleString(),
        favorite: false
    });

    saveNotes();
    displayNotes();

    document.getElementById("title").value = "";
    document.getElementById("note").value = "";
}

function toggleFavorites() {
    favOnly = !favOnly;

    document.getElementById("filterBtn").innerText =
        favOnly ? "📒 Show All Notes" : "⭐ Favorites";

    displayNotes();
}

function displayNotes() {
    let area = document.getElementById("notes");
    let search = document.getElementById("search").value.toLowerCase();

    area.innerHTML = "";

    let found = 0;

    notes.forEach(function(note, index) {

        if (
            !note.title.toLowerCase().includes(search) &&
            !note.text.toLowerCase().includes(search)
        ) {
            return;
        }

        if (favOnly && !note.favorite) {
            return;
        }

        found++;

        let box = document.createElement("div");

        let heading = document.createElement("h3");
        heading.innerText =
            (note.favorite ? "⭐ " : "") + note.title;

        let content = document.createElement("p");
        content.innerText = note.text;

        let date = document.createElement("small");
        date.innerText = note.date || "";

        let fav = document.createElement("button");
        fav.className = "fav-btn";
        fav.innerText = note.favorite ? "⭐ Favourite" : "☆ Favourite";

        fav.onclick = function() {
            notes[index].favorite = !notes[index].favorite;
            saveNotes();
            displayNotes();
        };

        let edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.innerText = "Edit";

        edit.onclick = function() {
            let newTitle = prompt("Edit title:", note.title);
            if (newTitle === null) return;

            let newText = prompt("Edit note:", note.text);
            if (newText === null) return;

            notes[index].title = newTitle.trim() || "Untitled";
            notes[index].text = newText.trim();

            saveNotes();
            displayNotes();
        };

        let del = document.createElement("button");
        del.className = "delete-btn";
        del.innerText = "Delete";

        del.onclick = function() {
            if (confirm("Delete this note?")) {
                notes.splice(index, 1);
                saveNotes();
                displayNotes();
            }
        };

        box.appendChild(heading);
        box.appendChild(content);
        box.appendChild(date);
        box.appendChild(document.createElement("br"));
        box.appendChild(fav);
        box.appendChild(edit);
        box.appendChild(del);

        area.appendChild(box);
    });

    if (found === 0) {
        area.innerHTML = favOnly
            ? '<p class="empty">No favourite notes ⭐</p>'
            : '<p class="empty">No notes found 📝</p>';
    }
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    let dark = document.body.classList.contains("dark-mode");

    localStorage.setItem("darkMode", dark ? "on" : "off");

    document.getElementById("darkBtn").innerText =
        dark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "on") {
    document.body.classList.add("dark-mode");
    document.getElementById("darkBtn").innerText = "☀️ Light Mode";
}

saveNotes();
displayNotes();

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js");
    });
}
</script>

</body>
</html>
