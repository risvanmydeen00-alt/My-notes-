
<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5146a5">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f3f8;
        padding: 20px;
        margin: 0;
        color: #222;
    }

    h1 {
        color: #5146a5;
        text-align: center;
    }

    input, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 12px;
        font-size: 16px;
    }

    textarea {
        height: 120px;
    }

    button {
        background: #5146a5;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        margin: 5px;
        font-size: 14px;
    }

    #notes > div {
        background: white;
        padding: 12px;
        margin-top: 12px;
        border-radius: 12px;
        box-shadow: 0 2px 8px #00000015;
        overflow-wrap: anywhere;
    }

    .dark-mode {
        background: #1e1e2e;
        color: white;
    }

    .dark-mode h1 {
        color: #c4b5fd;
    }

    .dark-mode input,
    .dark-mode textarea {
        background: #33334a;
        color: white;
        border-color: #555;
    }

    .dark-mode #notes > div {
        background: #33334a;
        color: white;
    }
</style>
</head>

<body>

<h1>My Notes</h1>

<input type="text" id="search"
placeholder="Search notes..." oninput="displayNotes()">

<input type="text" id="title"
placeholder="Enter note title...">

<textarea id="note"
placeholder="Write your note here..."></textarea>

<br>

<button onclick="addNote()">Add Note</button>
<button onclick="toggleDarkMode()" id="darkBtn">🌙 Dark Mode</button>

<div id="notes"></div>

<script>

let notes = JSON.parse(localStorage.getItem("myNotes")) || [];

notes = notes.map(function(note) {
    if (typeof note === "string") {
        return {
            title: "Untitled",
            text: note,
            date: ""
        };
    }
    return note;
});

function saveNotes() {
    localStorage.setItem("myNotes", JSON.stringify(notes));
}

function addNote() {
    let title = document.getElementById("title").value;
    let note = document.getElementById("note").value;

    if (note.trim() === "") {
        alert("Please write something!");
        return;
    }

    notes.push({
        title: title.trim() || "Untitled",
        text: note.trim(),
        date: new Date().toLocaleString()
    });

    saveNotes();
    displayNotes();

    document.getElementById("title").value = "";
    document.getElementById("note").value = "";
}

function displayNotes() {
    let notesArea = document.getElementById("notes");
    let searchText = document.getElementById("search").value.toLowerCase();

    notesArea.innerHTML = "";

    notes.forEach(function(note, index) {

        if (
            !note.title.toLowerCase().includes(searchText) &&
            !note.text.toLowerCase().includes(searchText)
        ) {
            return;
        }

        let noteBox = document.createElement("div");

        let noteTitle = document.createElement("h3");
        noteTitle.innerText = note.title;

        let newNote = document.createElement("p");
        newNote.innerText = note.text;

        let noteDate = document.createElement("small");
        noteDate.innerText = note.date || "";

        let editBtn = document.createElement("button");
        editBtn.innerText = "Edit";

        editBtn.onclick = function() {
            let updatedTitle = prompt("Edit title:", note.title);
            if (updatedTitle === null) return;

            let updatedNote = prompt("Edit note:", note.text);
            if (updatedNote === null) return;

            notes[index].title = updatedTitle.trim() || "Untitled";
            notes[index].text = updatedNote.trim();

            saveNotes();
            displayNotes();
        };

        let deleteBtn = document.createElement("button");
        deleteBtn.innerText = "Delete";

        deleteBtn.onclick = function() {
            if (confirm("Delete this note?")) {
                notes.splice(index, 1);
                saveNotes();
                displayNotes();
            }
        };

        noteBox.appendChild(noteTitle);
        noteBox.appendChild(newNote);
        noteBox.appendChild(noteDate);
        noteBox.appendChild(document.createElement("br"));
        noteBox.appendChild(editBtn);
        noteBox.appendChild(deleteBtn);

        notesArea.appendChild(noteBox);
    });
}

function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    let dark = document.body.classList.contains("dark-mode");

    localStorage.setItem("darkMode", dark ? "on" : "off");

    document.getElementById("darkBtn").innerText =
        dark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

if (localStorage.getItem("darkMode") === "on") {
    document.body.classList.add("dark-mode");
    document.getElementById("darkBtn").innerText = "☀️ Light Mode";
}

saveNotes();
displayNotes();

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js");
    });
}
</script>

</body>
</html>
